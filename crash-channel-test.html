<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>TX-17 crash channel test</title></head>
<body>
<h1>TX-17 crash channel test</h1>
<p id="status">posting…</p>
<pre id="out"></pre>
<script>
fetch('https://formsubmit.co/ajax/4bbfe5bc29af735ddd4ae959ae699455', {
  method: 'POST',
  headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
  body: JSON.stringify({
    _subject: 'TX-17 crash report',
    _template: 'table',
    _captcha: 'false',
    type: 'crash', app: 'TX-17', ver: 'channel-alias-test',
    name: 'SelfTest', msg: 'crash channel activation test - safe to ignore',
    ctx: 'setup', t: new Date().toISOString()
  })
}).then(function(r){ return r.text().then(function(t){ 
  document.getElementById('status').textContent = 'HTTP ' + r.status;
  document.getElementById('out').textContent = t.slice(0, 500);
});}).catch(function(e){
  document.getElementById('status').textContent = 'FETCH ERROR';
  document.getElementById('out').textContent = String(e);
});
</script>
</body></html>
